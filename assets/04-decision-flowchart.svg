<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 880" width="100%" height="100%">
  <defs>
    <pattern id="light-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#e2e8f0" stroke-width="0.75"/>
    </pattern>
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');
    text {
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Segoe UI', 'JetBrains Mono', sans-serif;
    }
    .code { font-family: 'JetBrains Mono', monospace; }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <rect width="100%" height="100%" fill="url(#light-grid)"/>

  <!-- HEADER -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
    <text x="110" y="19" fill="#0369a1" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">图 4 · DSH 真实分流实战</text>
    <text x="0" y="68" fill="#0f172a" font-size="28" font-weight="800">DSH 真实场景三档分流：我这次改动到底属于哪一档？</text>
    <text x="0" y="98" fill="#475569" font-size="14.5">结合 DSH 真实提交记录 ➔ 本项目提供模板与 verify-agent-note-* 脚本自动化核对</text>
  </g>

  <!-- 3 CARDS -->

  <!-- TIER 1: 80% IN PLACE -->
  <g transform="translate(60, 145)">
    <rect x="0" y="0" width="390" height="680" rx="16" fill="#ffffff" stroke="#059669" stroke-width="2.2" filter="url(#soft-shadow)"/>
    <path d="M 0 16 Q 0 0 16 0 L 374 0 Q 390 0 390 16 L 390 56 L 0 56 Z" fill="#f0fdf4"/>

    <rect x="18" y="16" width="110" height="24" rx="5" fill="#dcfce7"/>
    <text x="73" y="32" fill="#065f46" font-size="11.5" font-weight="800" text-anchor="middle">DSH 占 80% 大头</text>
    <text x="140" y="34" fill="#047857" font-size="15.5" font-weight="800">第 1 档：原地改两行</text>

    <g transform="translate(24, 76)">
      <text x="0" y="18" fill="#0f172a" font-size="14" font-weight="800">【DSH 真实场景】：</text>
      <text x="0" y="44" fill="#334155" font-size="12.5">既有功能的内部优化、接口签名改动、</text>
      <text x="0" y="68" fill="#334155" font-size="12.5">文件挪动路径，或者调整默认配置。</text>
      <text x="0" y="92" fill="#047857" font-size="12.5" font-weight="700">这块功能此前已经有一篇成熟的 Note。</text>

      <!-- Realistic DSH example box -->
      <g transform="translate(0, 115)">
        <rect x="0" y="0" width="342" height="110" rx="8" fill="#f0fdf4" stroke="#a7f3d0" stroke-width="1.2"/>
        <text x="14" y="24" fill="#059669" font-size="12" font-weight="800">📜 DSH 真实案例：</text>
        <text x="14" y="48" fill="#065f46" font-size="11">在重构 `ui-conversation` 输入框时，</text>
        <text x="14" y="70" fill="#065f46" font-size="11">DSH 工程师直接就地修改已有的</text>
        <text x="14" y="92" fill="#0369a1" font-size="10" class="code">2026-07-25-web-input-machine.md</text>
      </g>

      <!-- Action Box -->
      <g transform="translate(0, 245)">
        <text x="0" y="18" fill="#0f172a" font-size="14" font-weight="800">你只需要做：</text>

        <g transform="translate(0, 32)">
          <rect x="0" y="0" width="342" height="205" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
          <text x="16" y="30" fill="#059669" font-size="14" font-weight="800">打开老笔记，直接就地修改！</text>
          <text x="16" y="60" fill="#334155" font-size="12">• 修正事实（类名、路径、默认参数）</text>
          <text x="16" y="86" fill="#be123c" font-size="12" font-weight="700">• 严禁开新文件！（绝不开新篇稀释注意力）</text>
          <text x="16" y="112" fill="#be123c" font-size="12" font-weight="700">• 严禁记流水账！（别写几月几号改了啥）</text>
          <text x="16" y="138" fill="#334155" font-size="12">• 笔记永远代表系统“现行的法律”！</text>

          <rect x="16" y="158" width="310" height="30" rx="5" fill="#dcfce7"/>
          <text x="171" y="178" fill="#15803d" font-size="11.5" font-weight="800" text-anchor="middle">⏱ 耗时：30 秒改两行，老笔记永久保鲜！</text>
        </g>
      </g>
    </g>
  </g>

  <!-- TIER 2: EXEMPT (RED) -->
  <g transform="translate(485, 145)">
    <rect x="0" y="0" width="390" height="680" rx="16" fill="#ffffff" stroke="#e11d48" stroke-width="1.8" filter="url(#soft-shadow)"/>
    <path d="M 0 16 Q 0 0 16 0 L 374 0 Q 390 0 390 16 L 390 56 L 0 56 Z" fill="#fff1f2"/>

    <rect x="18" y="16" width="100" height="24" rx="5" fill="#ffe4e6"/>
    <text x="68" y="32" fill="#be123c" font-size="11.5" font-weight="800" text-anchor="middle">一律不写</text>
    <text x="130" y="34" fill="#be123c" font-size="15.5" font-weight="800">第 2 档：纯提交，别找事</text>

    <g transform="translate(24, 76)">
      <text x="0" y="18" fill="#0f172a" font-size="14" font-weight="800">【DSH 真实场景】：</text>
      <text x="0" y="44" fill="#334155" font-size="12.5">代码逻辑毫无改变的小改动，</text>
      <text x="0" y="68" fill="#334155" font-size="12.5">半年后绝对没有任何人会问</text>
      <text x="0" y="92" fill="#334155" font-size="12.5">“当时为什么这么选”。</text>

      <!-- Realistic DSH example box -->
      <g transform="translate(0, 115)">
        <rect x="0" y="0" width="342" height="110" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.2"/>
        <text x="14" y="24" fill="#e11d48" font-size="12" font-weight="800">📜 DSH 真实案例：</text>
        <text x="14" y="48" fill="#9f1239" font-size="10.5" class="code">commit: caf386f59c (修复测试命名)</text>
        <text x="14" y="70" fill="#9f1239" font-size="11">• 纯代码格式化 / Prettier 换行缩进</text>
        <text x="14" y="92" fill="#9f1239" font-size="11">• 给 Git 打 Release Tag / 依赖包小升级</text>
      </g>

      <!-- Action Box -->
      <g transform="translate(0, 245)">
        <text x="0" y="18" fill="#0f172a" font-size="14" font-weight="800">你只需要做：</text>

        <g transform="translate(0, 32)">
          <rect x="0" y="0" width="342" height="205" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
          <text x="16" y="30" fill="#be123c" font-size="14" font-weight="800">直接提交代码，严禁写笔记！</text>
          <text x="16" y="60" fill="#334155" font-size="12">• 不要给自己强行加戏</text>
          <text x="16" y="86" fill="#be123c" font-size="12" font-weight="700">• 为这种小事写 Note 只会污染仓库！</text>
          <text x="16" y="112" fill="#334155" font-size="12">• 保持目录树的绝对纯净</text>
          <text x="16" y="138" fill="#334155" font-size="12">• 直接 git commit 推代码！</text>

          <rect x="16" y="158" width="310" height="30" rx="5" fill="#ffe4e6"/>
          <text x="171" y="178" fill="#be123c" font-size="11.5" font-weight="800" text-anchor="middle">⏱ 耗时：0 秒，直接提交！</text>
        </g>
      </g>
    </g>
  </g>

  <!-- TIER 3: MAJOR (AMBER) -->
  <g transform="translate(910, 145)">
    <rect x="0" y="0" width="430" height="680" rx="16" fill="#ffffff" stroke="#d97706" stroke-width="1.8" filter="url(#shadow)"/>
    <path d="M 0 16 Q 0 0 16 0 L 414 0 Q 430 0 430 16 L 430 56 L 0 56 Z" fill="#fffbeb"/>

    <rect x="18" y="16" width="110" height="24" rx="5" fill="#fef3c7"/>
    <text x="73" y="32" fill="#92400e" font-size="11.5" font-weight="800" text-anchor="middle">重大技术选型</text>
    <text x="140" y="34" fill="#92400e" font-size="15.5" font-weight="800">第 3 档：新开一篇留痕</text>

    <g transform="translate(24, 76)">
      <text x="0" y="18" fill="#0f172a" font-size="14" font-weight="800">【DSH 真实场景】：</text>
      <text x="0" y="44" fill="#334155" font-size="12.5">做了全新架构设计，选了 A 淘汰了 B、C。</text>
      <text x="0" y="68" fill="#334155" font-size="12.5">半年后新来的 AI 看到代码，</text>
      <text x="0" y="92" fill="#334155" font-size="12.5">必定会好奇“当初为啥不用更简单的 B 呢？”</text>

      <!-- Realistic DSH example box -->
      <g transform="translate(0, 115)">
        <rect x="0" y="0" width="382" height="110" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2"/>
        <text x="14" y="24" fill="#d97706" font-size="12" font-weight="800">📜 DSH 真实案例：</text>
        <text x="14" y="48" fill="#78350f" font-size="10.5" class="code">2026-08-05-agent-teams.md</text>
        <text x="14" y="68" fill="#78350f" font-size="11">设计全新的 Agent 组队、邮箱与任务认领机制</text>
        <text x="14" y="90" fill="#0284c7" font-size="11" font-weight="700">★ 套用本项目 templates/implemented.md 模板</text>
      </g>

      <!-- Action Box -->
      <g transform="translate(0, 245)">
        <text x="0" y="18" fill="#0f172a" font-size="14" font-weight="800">你只需要做：</text>

        <g transform="translate(0, 32)">
          <rect x="0" y="0" width="382" height="205" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
          <text x="16" y="30" fill="#d97706" font-size="14" font-weight="800">按模板填 4 个空（总共200字）</text>
          <text x="16" y="58" fill="#334155" font-size="12">1. 遇到啥问题？ 2. 拍板了啥方案？</text>
          <text x="16" y="82" fill="#334155" font-size="12">3. 毙掉了谁、为啥不要它？ 4. 有啥代价？</text>
          <text x="16" y="108" fill="#0284c7" font-size="12" font-weight="700">★ 在代码入口贴一行 // Note: 见笔记...</text>
          <text x="16" y="132" fill="#059669" font-size="11.5" font-weight="700">跑 verify-agent-note-* 校验并随代码提交！</text>

          <rect x="16" y="158" width="350" height="30" rx="5" fill="#fef3c7"/>
          <text x="191" y="178" fill="#92400e" font-size="11.5" font-weight="800" text-anchor="middle">⏱ 耗时：3 分钟写完，给代码装上护栏！</text>
        </g>
      </g>
    </g>
  </g>
</svg>
